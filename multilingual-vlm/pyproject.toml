[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "multilingual-vlm-classification"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.4,<3", "sentence-transformers>=3,<6", "numpy>=1.26,<3", "pandas>=2.1,<3", "Pillow>=10,<13", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
data = ["kagglehub>=0.3,<1"]
[project.scripts]
vlm = "vlm.cli:main"
[tool.setuptools.packages.find]
include = ["vlm*"]
